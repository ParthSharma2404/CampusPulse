{% extends 'campus/base_public.html' %}

{% block title %}Student Sign In | CampusPulse{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 160px); display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
  <div class="clean-card" style="max-width: 420px; width: 100%; padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="margin: 0 auto 1rem; width: 48px; height: 48px; border-radius: var(--radius-md); background: var(--orange-primary); color: white; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-orange);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
      </div>
      <h1 style="font-size: 1.65rem; font-weight: 800; color: var(--text-primary); letter-spacing: -0.02em; margin-bottom: 0.25rem;">Student Sign In</h1>
      <p style="color: var(--text-secondary); font-size: 0.875rem;">Enter your university registration number or email to access your complaints.</p>
    </div>

    <form method="POST" action="{% url 'student_login' %}">
      {% csrf_token %}
      
      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.375rem;">Registration Number or Email</label>
        <input type="text" id="identifier" name="identifier" class="form-input-clean" placeholder="e.g. 21BCE1042 or rohan.s@campus.edu" required autofocus>
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-size: 0.8125rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.375rem;">Password</label>
        <input type="password" id="password" name="password" class="form-input-clean" placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn-clean btn-clean-orange" style="width: 100%; padding: 0.875rem; font-size: 0.9375rem;">
        Sign In to Student Portal
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-secondary);">
      New student? <a href="{% url 'student_register' %}" style="color: var(--orange-primary); font-weight: 600;">Create an account</a>
    </div>
  </div>
</div>
{% endblock %}
